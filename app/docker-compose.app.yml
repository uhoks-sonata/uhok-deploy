services:

  backend:
    build:
      context: ../../uhok-backend
      dockerfile: Dockerfile
    image: uhok-backend:3.2.1
    env_file:
      - .env
    extra_hosts:
      # 🔒 ML EC2 프라이빗 IP를 내부 도메인으로 매핑 (로컬: ML_PRIVATE_IP=host-gateway)
      - "ml.internal:${ML_PRIVATE_IP:?app/.env에 ML_PRIVATE_IP 설정 필요}"
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # 🔑 ML 통신 설정 (프라이빗 IP)
      - ML_INFERENCE_URL=http://ml.internal:8001
    ports:
      - "9000:9000"  # public EC2의 nginx가 프라이빗 IP로 접근 (보안그룹으로 public EC2만 허용)
    expose:
      - "9000"
    healthcheck:
      # /healthz 없으면 /openapi.json 혹은 /docs 등으로 변경
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request,sys\nu='http://localhost:9000/api/health'\ntry:\n  with urllib.request.urlopen(u, timeout=3) as r:\n    sys.exit(0 if r.status==200 else 1)\nexcept Exception:\n  sys.exit(1)\nPY"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [uhok_net]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"     # 외부 포트 공개 금지
    networks: [uhok_net]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

volumes:
  redis_data:

networks:
  uhok_net:
    external: true
